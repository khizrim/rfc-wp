services:
  rfc-db:
    image: mariadb:latest
    container_name: rfc-db
    volumes:
      - ./data:/var/lib/mysql
    env_file: .env
    restart: unless-stopped
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p$MYSQL_ROOT_PASSWORD", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
      
  rfc-wp:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: rfc-dev
    container_name: rfc-wp
    depends_on:
      rfc-db:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./themes:/var/www/html/wp-content/themes
      - ./plugins:/var/www/html/wp-content/plugins
      - ./wp-config.php:/var/www/html/wp-config.php
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/install.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
